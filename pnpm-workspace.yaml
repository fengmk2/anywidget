verifyDepsBeforeRun: install
packages:
  - "packages/*"
  - "docs/**"
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - vite-plus
  - "@voidzero-dev/*"
blockExoticSubdeps: false
catalog:
  vite: https://pkg.pr.new/voidzero-dev/vite-plus/@voidzero-dev/vite-plus-core@1633
  vitest: https://pkg.pr.new/voidzero-dev/vite-plus/@voidzero-dev/vite-plus-test@1633
  vite-plus: https://pkg.pr.new/voidzero-dev/vite-plus@1633
  esbuild: ^0.28.0
  typescript: ^6.0.2
  react: ^19.2.5
  react-dom: ^19.2.5
  "@types/react": ^19.2.14
  "@types/react-dom": ^19.2.3
  "@types/node": ^25.6.0
overrides:
  vite: "catalog:"
  vitest: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
